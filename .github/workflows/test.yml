name: Test & Quality Gates (Required)

# Purpose: Enforces code quality standards and blocks merges on failure
# - All steps MUST pass for workflow to succeed (no continue-on-error)
# - Runs on Node.js 20 (production version)
# - Enforces 80% code coverage threshold
# - Blocks PR merges if quality gates fail
# - Use for: Required quality gates before merging to main
#
# Note: ci.yml runs exploratory checks (failures don't block merges)

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Run security tests
        run: npm test -- __tests__/security
        env:
          CI: true

      - name: Verify OWASP coverage
        run: |
          echo "📊 Verifying OWASP Top 10 coverage..."
          TEST_COUNT=$(find __tests__/security -name "*.test.ts" -type f | wc -l)

          if [ "$TEST_COUNT" -lt 5 ]; then
            echo "❌ Security test files below minimum (5)"
            exit 1
          fi

          echo "✅ OWASP coverage verified ($TEST_COUNT test files)"

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold (80%)..."
          node -e "
          const fs = require('fs');
          const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const total = coverage.total;
          const statements = total.statements.pct;
          const branches = total.branches.pct;
          const functions = total.functions.pct;
          const lines = total.lines.pct;

          console.log('Coverage Summary:');
          console.log('  Statements:', statements + '%');
          console.log('  Branches:', branches + '%');
          console.log('  Functions:', functions + '%');
          console.log('  Lines:', lines + '%');

          const threshold = 80;
          const failed = [];

          if (statements < threshold) failed.push('statements (' + statements + '%)');
          if (branches < threshold) failed.push('branches (' + branches + '%)');
          if (functions < threshold) failed.push('functions (' + functions + '%)');
          if (lines < threshold) failed.push('lines (' + lines + '%)');

          if (failed.length > 0) {
            console.error('❌ Coverage threshold not met for: ' + failed.join(', '));
            console.error('Required: 80% minimum for all metrics');
            process.exit(1);
          }

          console.log('✅ All coverage thresholds met (>= 80%)');
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;

            const comment = `## 📊 Test Coverage Report

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Statements | ${total.statements.pct}% | ${total.statements.pct >= 80 ? '✅' : '❌'} |
            | Branches | ${total.branches.pct}% | ${total.branches.pct >= 80 ? '✅' : '❌'} |
            | Functions | ${total.functions.pct}% | ${total.functions.pct >= 80 ? '✅' : '❌'} |
            | Lines | ${total.lines.pct}% | ${total.lines.pct >= 80 ? '✅' : '❌'} |

            **Threshold:** 80% minimum required for all metrics
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Check test job status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed or were cancelled"
            echo "Please fix failing tests before merging"
            exit 1
          fi
          echo "✅ All tests passed!"
