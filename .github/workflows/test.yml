name: Test & Quality Gates (Required)

# Purpose: Enforces code quality standards and blocks merges on failure
# - All steps MUST pass for workflow to succeed (no continue-on-error)
# - Runs on Node.js 20 (production version)
# - Runs unit tests and security tests
# - Coverage checking is disabled in CI (run `npm run test:coverage` locally)
# - Blocks PR merges if quality gates fail
# - Use for: Required quality gates before merging to main
#
# Note: ci.yml runs exploratory checks with coverage (failures don't block merges)

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sunnystack
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sunnystack
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sunnystack:test_password@localhost:5432/sunnystack

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:ci
        env:
          CI: true
          DATABASE_URL: postgresql://sunnystack:test_password@localhost:5432/sunnystack

      - name: Run security tests
        run: npm test -- __tests__/security
        env:
          CI: true
          DATABASE_URL: postgresql://sunnystack:test_password@localhost:5432/sunnystack

      - name: Verify OWASP coverage
        run: |
          echo "📊 Verifying OWASP Top 10 coverage..."
          TEST_COUNT=$(find __tests__/security -name "*.test.ts" -type f | wc -l)

          if [ "$TEST_COUNT" -lt 5 ]; then
            echo "❌ Security test files below minimum (5)"
            exit 1
          fi

          echo "✅ OWASP coverage verified ($TEST_COUNT test files)"

      # Coverage checking disabled - run `npm run test:coverage` locally to check coverage
      # Coverage thresholds are enforced via jest.config.mjs for local development only

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Check test job status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed or were cancelled"
            echo "Please fix failing tests before merging"
            exit 1
          fi
          echo "✅ All tests passed!"
