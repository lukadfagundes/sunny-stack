name: Deploy to GitHub Pages (Manual Only - Deployed via Vercel)

on:
  # This project is deployed via Vercel, not GitHub Pages
  # Manual trigger only for testing purposes
  workflow_dispatch:

# CRITICAL: Must have write permissions for Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build for Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect and setup environment
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> $GITHUB_OUTPUT
            echo "Node.js project detected"
          elif [ -f "requirements.txt" ]; then
            echo "type=python" >> $GITHUB_OUTPUT
            echo "Python project detected"
          else
            echo "type=static" >> $GITHUB_OUTPUT
            echo "Static site detected"
          fi

      - name: Setup Node.js (if applicable)
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: "npm"

      - name: Install and build (Node.js)
        if: steps.detect.outputs.type == 'node'
        env:
          RESEND_API_KEY: "mock_api_key_for_build"
          NODE_ENV: "production"
        run: |
          npm ci --prefer-offline --no-audit

          # Check for Next.js and run appropriate build command
          if grep -q "next" package.json; then
            npm run export || npm run build
            # Next.js 13+ uses 'out' directory for static export
            if [ -d "out" ]; then
              echo "BUILD_DIR=out" >> $GITHUB_ENV
            elif [ -d ".next" ]; then
              echo "BUILD_DIR=.next" >> $GITHUB_ENV
            fi
          else
            npm run build || npm run dist || echo "No build script"
            # Detect build output directory
            if [ -d "build" ]; then
              echo "BUILD_DIR=build" >> $GITHUB_ENV
            elif [ -d "dist" ]; then
              echo "BUILD_DIR=dist" >> $GITHUB_ENV
            elif [ -d "public" ]; then
              echo "BUILD_DIR=public" >> $GITHUB_ENV
            else
              echo "BUILD_DIR=." >> $GITHUB_ENV
            fi
          fi

      - name: Setup Python (if applicable)
        if: steps.detect.outputs.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build documentation (Python)
        if: steps.detect.outputs.type == 'python'
        run: |
          pip install -r requirements.txt || true
          pip install sphinx mkdocs || true

          # Try to build documentation
          if [ -f "mkdocs.yml" ]; then
            mkdocs build
            echo "BUILD_DIR=site" >> $GITHUB_ENV
          elif [ -f "docs/conf.py" ]; then
            cd docs && make html
            echo "BUILD_DIR=docs/_build/html" >> $GITHUB_ENV
          else
            echo "BUILD_DIR=." >> $GITHUB_ENV
          fi

      - name: Set build directory (static)
        if: steps.detect.outputs.type == 'static'
        run: echo "BUILD_DIR=." >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ env.BUILD_DIR }}
          retention-days: 1

  deploy-peaceiris:
    name: Deploy using Peaceiris Action
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./deploy

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy to GitHub Pages: ${{ github.sha }}"
          cname: ${{ vars.CNAME }} # Optional: custom domain

      - name: Output deployment URL
        run: |
          echo "🚀 Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ vars.CNAME }}" ]; then
            echo "- Custom Domain: https://${{ vars.CNAME }}/" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # Alternative deployment using GitHub's official action
  deploy-official:
    name: Deploy using Official GitHub Pages Action
    runs-on: ubuntu-latest
    needs: build
    if: false # Disabled by default, enable if preferred

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./deploy

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.deployment.outputs.page_url }}"
