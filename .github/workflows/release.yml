# Release Workflow - GitHub Releases Gate
#
# FLOW: Tag push (v*.*.*) → Extract version → Validate CHANGELOG → Run CI → Create DRAFT Release
#
# The draft release is the human approval gate. Nothing deploys until
# the release is manually published in GitHub. On publish, deploy.yml
# takes over and triggers bot + Vercel deployments.
#
# Usage: npm run release:patch  (or release:minor / release:major)
#        This bumps version, creates tag, and pushes — triggering this workflow.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Only one release at a time per tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Extract version from git tag
  # ---------------------------------------------------------------------------
  version:
    name: Extract Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          echo "Version: $VERSION"

  # ---------------------------------------------------------------------------
  # Job 2: Extract and validate release notes from CHANGELOG.md
  # ---------------------------------------------------------------------------
  release-notes:
    name: Extract Release Notes
    runs-on: ubuntu-latest

    outputs:
      notes: ${{ steps.extract-notes.outputs.notes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: extract-notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          echo "Extracting release notes for version $VERSION..."

          # Extract the section between ## [VERSION] and the next ## heading
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[/!p;}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::No release notes found for version $VERSION in CHANGELOG.md"
            echo "Ensure CHANGELOG.md has a section: ## [$VERSION]"
            exit 1
          fi

          # Trim leading/trailing whitespace
          NOTES=$(echo "$NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -z "$NOTES" ]; then
            echo "::error::Release notes section for $VERSION is empty in CHANGELOG.md"
            exit 1
          fi

          echo "Release notes found:"
          echo "$NOTES"

          # Write to output using delimiter for multiline
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 3: Run full CI pipeline
  # ---------------------------------------------------------------------------
  ci:
    name: CI Quality Gates
    needs: [version]
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Job 4: Create draft GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [version, release-notes, ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "v${{ needs.version.outputs.version }}"
          body: ${{ needs.release-notes.outputs.notes }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
