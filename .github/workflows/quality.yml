name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high

  bundle-size:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and analyze
        run: npm run build
      - name: Report bundle size
        run: |
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d ".next/static" ]; then
            TOTAL=$(du -sh .next/static | cut -f1)
            echo "**Total static assets:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Directory | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
            for dir in .next/static/*/; do
              if [ -d "$dir" ]; then
                NAME=$(basename "$dir")
                SIZE=$(du -sh "$dir" | cut -f1)
                echo "| $NAME | $SIZE |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ".next/routes-manifest.json" ]; then
            ROUTES=$(node -e "const m=require('./.next/routes-manifest.json'); console.log(m.staticRoutes.length + m.dynamicRoutes.length)")
            echo "**Total routes:** $ROUTES" >> $GITHUB_STEP_SUMMARY
          fi
