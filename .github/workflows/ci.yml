name: CI Pipeline (Non-Blocking)

# Purpose: Exploratory CI checks that report issues but don't block merges
# - Uses continue-on-error: true for most steps (failures don't fail the workflow)
# - Runs on Node.js 18 for compatibility testing
# - Generates artifacts and reports for review
# - Use for: Gathering metrics, optional checks, experimental validations
#
# Note: test.yml enforces required quality gates (this workflow does not block merges)

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

env:
  NODE_VERSION: "18"
  CACHE_VERSION: v1

jobs:
  # JavaScript/TypeScript Job
  node-ci:
    name: Node.js CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Validate Environment Variables
        id: validate-env
        run: |
          echo "Validating Vercel environment configuration..."
          npm run validate:env:vercel || true
        continue-on-error: true

      - name: Validate Prerequisites
        id: validate-prereqs
        run: |
          echo "Validating deployment prerequisites..."
          npm run validate:prerequisites || true
        continue-on-error: true

      - name: Build Bot
        id: build-bot
        run: |
          echo "Building Discord bot..."
          npm run build:bot || true
        continue-on-error: true

      - name: Run ESLint
        id: eslint
        run: |
          if [ -f "package.json" ]; then
            npm run lint || npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
          fi
        continue-on-error: true

      - name: Run Tests with Coverage
        id: tests
        run: |
          if [ -f "package.json" ]; then
            npm test -- --coverage --json --outputFile=test-results.json --ci || true
            if [ -d "coverage" ]; then
              cp coverage/coverage-summary.json ./coverage-summary.json 2>/dev/null || true
            fi
          fi
        continue-on-error: true

      - name: Run Security Audit
        id: security
        run: |
          if [ -f "package.json" ]; then
            npm audit --json > npm-audit.json || true
          fi
        continue-on-error: true

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            test-results.json

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            npm-audit.json
            eslint-report.json

  # Summary Job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [node-ci]
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [Coverage Report](coverage-report)" >> $GITHUB_STEP_SUMMARY
          echo "- [Security Reports](security-reports)" >> $GITHUB_STEP_SUMMARY
