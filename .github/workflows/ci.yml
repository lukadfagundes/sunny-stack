name: Trinity CI Pipeline

# Trinity Method BAS 6-Phase Quality Gates
# Enforces quality standards for sunny-stack (Next.js 15 + TypeScript)
# Coverage threshold: ≥80% (enforced via jest.config.mjs)

on:
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop
  workflow_call:  # Allows release.yml to reuse this pipeline
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

env:
  NODE_VERSION: "22.x"
  CACHE_VERSION: v1

jobs:
  trinity-quality-gates:
    name: Trinity BAS 6-Phase Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      # Setup Node.js
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # =============================================
      # BAS PHASE 1: Linting (with auto-fix)
      # =============================================
      - name: 'BAS Phase 1: Linting'
        id: lint
        run: |
          echo "🔍 Running ESLint with auto-fix..."
          npm run lint -- --fix || npm run lint:fix || true
          echo "✅ Linting phase complete"

      # =============================================
      # BAS PHASE 2: Structure Validation
      # =============================================
      - name: 'BAS Phase 2: Structure Validation'
        id: structure
        run: |
          echo "🔍 Validating project structure..."

          # Check required directories exist
          dirs=("app" "components" "lib" "__tests__" "trinity" ".claude")
          for dir in "${dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Required directory missing: $dir"
              exit 1
            fi
          done

          # Check package.json has required scripts
          required_scripts=("test" "build" "lint" "type-check")
          for script in "${required_scripts[@]}"; do
            if ! grep -q "\"$script\"" package.json; then
              echo "❌ package.json missing '$script' script"
              exit 1
            fi
          done

          # Check Trinity Method files exist
          trinity_files=("trinity/CLAUDE.md" ".claude/EMPLOYEE-DIRECTORY.md" "CLAUDE.md")
          for file in "${trinity_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "⚠️  Trinity file missing: $file (warning only)"
            fi
          done

          echo "✅ Structure validation complete"

      # =============================================
      # BAS PHASE 3: Build Validation
      # =============================================
      - name: 'BAS Phase 3: Build Validation'
        id: build
        run: |
          echo "🔨 Building Next.js application..."
          npm run build
          echo "✅ Build validation complete"

      # =============================================
      # BAS PHASE 4: Type Checking
      # =============================================
      - name: 'BAS Phase 4: Type Checking'
        id: typecheck
        run: |
          echo "🔍 Running TypeScript type checker..."
          npm run type-check
          echo "⚠️  Note: TypeScript strict mode currently disabled"
          echo "✅ Type checking complete"

      # =============================================
      # BAS PHASE 5: Testing (All Tests Pass)
      # =============================================
      - name: 'BAS Phase 5: Testing'
        id: tests
        run: |
          echo "🧪 Running all tests with Jest..."
          npm run test:ci
          echo "✅ All tests passed"

      # =============================================
      # BAS PHASE 6: Coverage Check (≥80%)
      # =============================================
      - name: 'BAS Phase 6: Coverage Check'
        id: coverage
        run: |
          echo "📊 Checking test coverage..."
          npm run test:coverage -- --ci

          # Jest enforces threshold via jest.config.mjs
          # Coverage requirement: 80% for branches, functions, lines, statements

          echo "Validating coverage meets 80% threshold..."

          # Check if coverage-summary.json exists
          if [ -f "coverage/coverage-summary.json" ]; then
            # Extract coverage percentages
            lines=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct);")
            branches=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.branches.pct);")
            functions=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.functions.pct);")
            statements=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct);")

            echo "Coverage Report:"
            echo "  Lines:      ${lines}%"
            echo "  Branches:   ${branches}%"
            echo "  Functions:  ${functions}%"
            echo "  Statements: ${statements}%"

            # Jest already enforces threshold, but we double-check
            threshold=80
            if (( $(echo "$lines < $threshold" | bc -l) )) || \
               (( $(echo "$branches < $threshold" | bc -l) )) || \
               (( $(echo "$functions < $threshold" | bc -l) )) || \
               (( $(echo "$statements < $threshold" | bc -l) )); then
              echo "❌ Coverage below 80% threshold"
              exit 1
            fi

            echo "✅ Coverage meets 80% threshold"
          else
            echo "⚠️  coverage-summary.json not found"
            echo "❌ Coverage validation failed"
            exit 1
          fi

          echo "✅ Coverage validation complete"

      # =============================================
      # OPTIONAL: E2E Tests with Playwright
      # =============================================
      - name: 'OPTIONAL: E2E Tests (Playwright)'
        id: e2e
        continue-on-error: true  # E2E tests don't block CI
        run: |
          echo "🎭 Running Playwright E2E tests..."
          npx playwright install --with-deps chromium
          npm run test:e2e || echo "⚠️  E2E tests failed (non-blocking)"

      # =============================================
      # OPTIONAL: Security Audit
      # =============================================
      - name: 'OPTIONAL: Security Audit'
        id: security
        continue-on-error: true  # Security audit doesn't block CI
        run: |
          echo "🔒 Running npm security audit..."
          npm audit --audit-level=high || echo "⚠️  Security vulnerabilities found (non-blocking)"

      # =============================================
      # OPTIONAL: Best Practices Validation
      # =============================================
      - name: 'OPTIONAL: Best Practices'
        id: practices
        continue-on-error: true  # Best practices are warnings only
        run: |
          echo "📋 Validating best practices..."

          issues=0

          # Check: No console.log in production code (allow in tests/scripts)
          if grep -r "console\.log" app/ components/ lib/ --exclude-dir=__tests__ 2>/dev/null | grep -v "//.*console\.log" | grep -v "/\*.*console\.log" | head -5; then
            echo "⚠️  Found console.log in production code"
            issues=$((issues+1))
          fi

          # Check: No TODO comments without issue references
          if grep -r "TODO" app/ components/ lib/ 2>/dev/null | grep -v "TODO(#" | grep -v "//.*TODO:.*#" | head -5; then
            echo "⚠️  Found TODO without issue reference"
            issues=$((issues+1))
          fi

          # Check: TypeScript strict mode (currently disabled)
          if ! grep -q '"strict": true' tsconfig.json; then
            echo "⚠️  TypeScript strict mode not enabled (known issue)"
            issues=$((issues+1))
          fi

          # Check: Prisma schema exists
          if [ ! -f "prisma/schema.prisma" ]; then
            echo "⚠️  Prisma schema not found"
            issues=$((issues+1))
          fi

          if [ $issues -gt 0 ]; then
            echo "⚠️  Found $issues best practice issues (warnings only)"
          else
            echo "✅ All best practice checks passed"
          fi

          echo "✅ Best practices validation complete"

      # =============================================
      # Upload Coverage Reports
      # =============================================
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage/lcov.info
            coverage/coverage-summary.json
          retention-days: 30

      # =============================================
      # Upload Test Results
      # =============================================
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            playwright-report/
          retention-days: 30

      # =============================================
      # Trinity Quality Summary
      # =============================================
      - name: Trinity Quality Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
          echo "   Trinity BAS 6-Phase Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Phases (CI Blocking)" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 1: Linting | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 2: Structure | ${{ steps.structure.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 3: Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 4: Type Check | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 5: Tests | ${{ steps.tests.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 6: Coverage (≥80%) | ${{ steps.coverage.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Optional Checks (Non-Blocking)" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (Playwright) | ${{ steps.e2e.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ steps.security.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Best Practices | ${{ steps.practices.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Framework:** Next.js 15.5.9 with App Router" >> $GITHUB_STEP_SUMMARY
          echo "**Runtime:** Node.js ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Framework:** Jest 30.1.3 + Playwright 1.55.0" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage Threshold:** 80% (lines, branches, functions, statements)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY

          # Also output to console
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   Trinity BAS 6-Phase Quality Gates"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Required Phases:"
          echo "  Phase 1: Linting            - ${{ steps.lint.outcome }}"
          echo "  Phase 2: Structure          - ${{ steps.structure.outcome }}"
          echo "  Phase 3: Build              - ${{ steps.build.outcome }}"
          echo "  Phase 4: Type Check         - ${{ steps.typecheck.outcome }}"
          echo "  Phase 5: Tests              - ${{ steps.tests.outcome }}"
          echo "  Phase 6: Coverage (≥80%)    - ${{ steps.coverage.outcome }}"
          echo ""
          echo "Optional Checks:"
          echo "  E2E Tests (Playwright)      - ${{ steps.e2e.outcome }}"
          echo "  Security Audit              - ${{ steps.security.outcome }}"
          echo "  Best Practices              - ${{ steps.practices.outcome }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
