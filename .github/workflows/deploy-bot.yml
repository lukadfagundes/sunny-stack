name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: deploy-pi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Deploy to Raspberry Pi
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sunny-stack.com

    outputs:
      previous-image: ${{ steps.backup-image.outputs.image }}
      deployment-successful: ${{ steps.deployment-result.outputs.success }}

    steps:
      - name: Backup current image tag
        id: backup-image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          passphrase: ${{ secrets.PI_SSH_PASSPHRASE }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -e

            echo "🔍 Capturing current deployment state for rollback..."
            cd ~/sunny-stack || exit 0

            # Get current bot image ID (if exists)
            CURRENT_IMAGE=$(docker images sunny-stack-bot:latest -q 2>/dev/null || echo "none")

            if [ "$CURRENT_IMAGE" != "none" ]; then
              # Tag current image as backup
              docker tag sunny-stack-bot:latest sunny-stack-bot:backup 2>/dev/null || true
              echo "✅ Current image backed up as sunny-stack-bot:backup"
              echo "Image ID: $CURRENT_IMAGE"
            else
              echo "ℹ️  No previous image to backup (first deployment)"
            fi

            # Export for next steps (SSH action doesn't support GITHUB_OUTPUT)
            # This is informational only - rollback uses docker images directly

      - name: Deploy to Raspberry Pi
        id: deploy-main
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          passphrase: ${{ secrets.PI_SSH_PASSPHRASE }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          timeout: 60m
          command_timeout: 45m
          script: |
            set -e  # Exit on any error

            echo "================================================"
            echo "Starting Raspberry Pi Deployment"
            echo "================================================"

            # Navigate to project directory
            cd ~/sunny-stack || {
              echo "❌ Directory ~/sunny-stack not found"
              exit 1
            }

            # Pull latest code from GitHub
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Verify .env.production exists
            if [ ! -f .env.production ]; then
              echo "❌ .env.production not found!"
              exit 1
            fi

            echo "✅ Repository updated to latest commit"
            echo "Commit: $(git log -1 --oneline)"

            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker compose down || true

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker rmi -f sunny-stack-bot:latest || true
            docker builder prune -af

            # Build bot image
            echo "🔨 Building bot image..."
            docker build --no-cache \
              -t sunny-stack-bot:latest \
              -f Dockerfile \
              . 2>&1 | tee build-bot.log

            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "❌ Bot image build failed"
              tail -100 build-bot.log
              exit 1
            fi

            echo "✅ Bot image built successfully"

            # Start production services
            echo "🚀 Starting production services..."
            docker compose up -d

            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Check service status
            echo "🔍 Checking service status..."
            docker compose ps

            # Verify PostgreSQL is healthy
            echo "🔍 Checking PostgreSQL health..."
            for i in {1..10}; do
              if docker compose exec -T postgres pg_isready -U sunnystack; then
                echo "✅ PostgreSQL is healthy"
                break
              fi
              echo "Attempt $i/10 - PostgreSQL not ready, waiting..."
              sleep 3
            done

            # Run database migrations
            echo "📊 Running database migrations..."
            docker compose exec -T discord-bot \
              npx prisma migrate deploy 2>&1 | tee migration.log

            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "⚠️  Migrations may have failed - check logs"
              cat migration.log
            else
              echo "✅ Migrations completed"
            fi

            # Verify bot health
            echo "🔍 Checking bot health..."
            for i in {1..15}; do
              HEALTH=$(curl -sf http://localhost:8080/health || echo "failed")
              if echo "$HEALTH" | grep -q "healthy"; then
                echo "✅ Bot health check passed"
                echo "$HEALTH"
                break
              fi
              echo "Attempt $i/15 - Bot not healthy yet, waiting..."
              sleep 3
            done

            # Check bot logs for Discord connection
            echo "🔍 Checking bot Discord connection..."
            sleep 5
            docker compose logs --tail=50 discord-bot | tee bot-logs.txt

            if grep -q "Bot ready and operational\|Connected to Discord Gateway" bot-logs.txt; then
              echo "✅ Bot connected to Discord"
            else
              echo "⚠️  Bot connection not confirmed - check logs"
            fi

            # Display resource usage (with timeout to avoid hanging)
            echo "📊 Container resource usage:"
            timeout 10 docker stats sunny-stack-bot sunny-stack-db --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}" || echo "⚠️  Stats collection timed out (non-critical)"

            # Clean up old images (older than 7 days)
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -af --filter "until=168h" || true

            echo "================================================"
            echo "✅ Deployment Complete"
            echo "================================================"
            echo "PostgreSQL: $(docker inspect -f '{{.State.Health.Status}}' sunny-stack-db)"
            echo "Bot: $(docker inspect -f '{{.State.Health.Status}}' sunny-stack-bot)"
            echo "================================================"

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          passphrase: ${{ secrets.PI_SSH_PASSPHRASE }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e

            echo "🔍 Post-Deployment Health Verification"
            echo "========================================"

            cd ~/sunny-stack

            # Check PostgreSQL health
            echo "Checking PostgreSQL..."
            PG_STATUS=$(docker inspect -f '{{.State.Health.Status}}' sunny-stack-db 2>/dev/null || echo "unknown")
            if [ "$PG_STATUS" != "healthy" ]; then
              echo "❌ PostgreSQL health check failed: $PG_STATUS"
              exit 1
            fi
            echo "✅ PostgreSQL is healthy"

            # Check Bot health with retries
            echo "Checking Bot health endpoint..."
            MAX_RETRIES=3
            RETRY_DELAY=10

            for i in $(seq 1 $MAX_RETRIES); do
              HEALTH_RESPONSE=$(curl -sf http://localhost:8080/health || echo "failed")

              if echo "$HEALTH_RESPONSE" | grep -q "healthy"; then
                echo "✅ Bot health check passed (attempt $i/$MAX_RETRIES)"
                echo "Response: $HEALTH_RESPONSE"
                break
              fi

              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ Bot health check failed after $MAX_RETRIES attempts"
                echo "Last response: $HEALTH_RESPONSE"

                echo "Bot container status:"
                docker ps -a | grep sunny-stack-bot

                echo "Recent bot logs:"
                docker logs --tail=50 sunny-stack-bot

                exit 1
              fi

              echo "⏳ Health check attempt $i/$MAX_RETRIES failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            done

            # Check Bot container is running
            echo "Checking Bot container status..."
            BOT_STATUS=$(docker inspect -f '{{.State.Status}}' sunny-stack-bot 2>/dev/null || echo "unknown")
            if [ "$BOT_STATUS" != "running" ]; then
              echo "❌ Bot container is not running: $BOT_STATUS"
              docker logs --tail=100 sunny-stack-bot
              exit 1
            fi
            echo "✅ Bot container is running"

            # Check Discord connection in logs
            echo "Verifying Discord connection..."
            sleep 5
            if docker logs --tail=100 sunny-stack-bot 2>&1 | grep -q "Bot ready and operational\|Connected to Discord Gateway\|Ready!"; then
              echo "✅ Bot connected to Discord"
            else
              echo "⚠️  Discord connection not confirmed in logs (may still be connecting)"
              docker logs --tail=50 sunny-stack-bot
            fi

            echo "========================================"
            echo "✅ All health checks passed"
            echo "Deployment verified successfully"

      - name: Send Discord notification on success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "✅ Deployed to Raspberry Pi"
          description: |
            **Commit:** `${{ github.event.head_commit.message }}`
            **Author:** ${{ github.actor }}
            **Branch:** `main`

            **Services:**
            • PostgreSQL: Running
            • Discord Bot: Connected

            [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0x00FF00
          username: GitHub Actions

      - name: Send Discord notification on failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "❌ Pi Deployment Failed"
          description: |
            **Commit:** `${{ github.event.head_commit.message }}`
            **Author:** ${{ github.actor }}
            **Branch:** `main`

            Deployment to Raspberry Pi failed.
            **Automatic rollback will be attempted.**

            [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xFF0000
          username: GitHub Actions

  # ---------------------------------------------------------------------------
  # Automatic Rollback (on deployment failure)
  # ---------------------------------------------------------------------------
  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Rollback to previous image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          passphrase: ${{ secrets.PI_SSH_PASSPHRASE }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          timeout: 15m
          command_timeout: 10m
          script: |
            set -e

            echo "================================================"
            echo "🔄 Starting Automatic Rollback"
            echo "================================================"

            cd ~/sunny-stack || {
              echo "❌ Directory ~/sunny-stack not found"
              exit 1
            }

            # Check if backup image exists
            BACKUP_IMAGE=$(docker images sunny-stack-bot:backup -q 2>/dev/null || echo "none")

            if [ "$BACKUP_IMAGE" = "none" ]; then
              echo "⚠️  No backup image available for rollback"
              echo "This may be the first deployment - manual intervention required"
              exit 1
            fi

            echo "✅ Backup image found: $BACKUP_IMAGE"

            # Stop current (failed) containers
            echo "🛑 Stopping current containers..."
            docker compose down || true

            # Restore backup image as latest
            echo "🔄 Restoring backup image..."
            docker tag sunny-stack-bot:backup sunny-stack-bot:latest

            # Restart services with backup image
            echo "🚀 Starting services with backup image..."
            docker compose up -d

            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Verify PostgreSQL health
            echo "🔍 Verifying PostgreSQL health..."
            for i in {1..10}; do
              if docker compose exec -T postgres pg_isready -U sunnystack; then
                echo "✅ PostgreSQL is healthy"
                break
              fi
              echo "Attempt $i/10 - PostgreSQL not ready, waiting..."
              sleep 3
            done

            # Verify bot health
            echo "🔍 Verifying bot health..."
            for i in {1..15}; do
              HEALTH=$(curl -sf http://localhost:8080/health || echo "failed")
              if echo "$HEALTH" | grep -q "healthy"; then
                echo "✅ Bot health check passed"
                echo "$HEALTH"
                break
              fi
              echo "Attempt $i/15 - Bot not healthy yet, waiting..."
              sleep 3
            done

            # Check bot Discord connection
            echo "🔍 Checking Discord connection..."
            sleep 5
            if docker logs --tail=50 sunny-stack-bot 2>&1 | grep -q "Bot ready and operational\|Connected to Discord Gateway\|Ready!"; then
              echo "✅ Bot connected to Discord"
            else
              echo "⚠️  Discord connection not confirmed (bot may still be starting)"
            fi

            # Display final status
            echo "================================================"
            echo "✅ Rollback Complete"
            echo "================================================"
            echo "PostgreSQL: $(docker inspect -f '{{.State.Health.Status}}' sunny-stack-db)"
            echo "Bot: $(docker inspect -f '{{.State.Health.Status}}' sunny-stack-bot)"
            echo "================================================"

      - name: Verify rollback success
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          passphrase: ${{ secrets.PI_SSH_PASSPHRASE }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -e

            echo "🔍 Verifying Rollback Success"
            echo "========================================"

            cd ~/sunny-stack

            # Check both containers are healthy
            PG_STATUS=$(docker inspect -f '{{.State.Health.Status}}' sunny-stack-db 2>/dev/null || echo "unknown")
            BOT_STATUS=$(docker inspect -f '{{.State.Status}}' sunny-stack-bot 2>/dev/null || echo "unknown")

            if [ "$PG_STATUS" != "healthy" ]; then
              echo "❌ PostgreSQL rollback failed: $PG_STATUS"
              exit 1
            fi

            if [ "$BOT_STATUS" != "running" ]; then
              echo "❌ Bot rollback failed: $BOT_STATUS"
              exit 1
            fi

            # Final health check
            HEALTH=$(curl -sf http://localhost:8080/health || echo "failed")
            if ! echo "$HEALTH" | grep -q "healthy"; then
              echo "❌ Bot health check failed after rollback"
              exit 1
            fi

            echo "✅ All services healthy after rollback"
            echo "========================================"

      - name: Send rollback notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "🔄 Automatic Rollback ${{ job.status == 'success' && 'Successful' || 'Failed' }}"
          description: |
            **Original Commit:** `${{ github.event.head_commit.message }}`
            **Author:** ${{ github.actor }}
            **Action:** Deployment failed, rolled back to previous version

            ${{ job.status == 'success' && '✅ Services restored to previous working state' || '❌ Rollback failed - manual intervention required' }}

            [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ job.status == 'success' && '0xFFA500' || '0xFF0000' }}
          username: GitHub Actions
