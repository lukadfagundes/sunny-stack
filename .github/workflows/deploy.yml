# Deploy Workflow - Triggered when a GitHub Release is published
#
# FLOW: Release published → Deploy bot to Pi → Deploy to Vercel (production) → Notify Discord
#
# This is the second half of the release gate. After release.yml creates a
# draft release, a human reviews and publishes it. Publishing triggers this
# workflow which deploys everything.
#
# Vercel preview deploys happen automatically on push to main (git integration).
# This workflow handles PRODUCTION deploys only, triggered by release publish.

name: Deploy

on:
  release:
    types: [published]

# Only one deployment at a time
concurrency:
  group: deploy-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Deploy Discord bot to Raspberry Pi
  # ---------------------------------------------------------------------------
  deploy-bot:
    name: Deploy Bot to Pi
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Vercel (Production)
  # Uses Vercel CLI to create a production deployment with domains assigned.
  # Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets.
  # ---------------------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest

    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Validate Vercel secrets
        run: |
          missing=()
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing+=("VERCEL_TOKEN")
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing+=("VERCEL_PROJECT_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing secrets: ${missing[*]}. Skipping Vercel deployment."
            echo "To enable: add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub repo settings."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: check

      - name: Checkout code
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        if: steps.check.outputs.skip != 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel project configuration
        if: steps.check.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        if: steps.check.outputs.skip != 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        if: steps.check.outputs.skip != 'true'
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ---------------------------------------------------------------------------
  # Job 3: Send Discord notification with deployment results
  # ---------------------------------------------------------------------------
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [deploy-bot, deploy-vercel]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          BOT_RESULT="${{ needs.deploy-bot.result }}"
          VERCEL_RESULT="${{ needs.deploy-vercel.result }}"

          if [ "$BOT_RESULT" = "success" ] && [ "$VERCEL_RESULT" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=All deployments successful" >> "$GITHUB_OUTPUT"
            echo "color=0x00FF00" >> "$GITHUB_OUTPUT"
          elif [ "$BOT_RESULT" = "success" ] || [ "$VERCEL_RESULT" = "success" ]; then
            echo "status=partial" >> "$GITHUB_OUTPUT"
            echo "message=Partial deployment (Bot: $BOT_RESULT, Vercel: $VERCEL_RESULT)" >> "$GITHUB_OUTPUT"
            echo "color=0xFFA500" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "message=All deployments failed" >> "$GITHUB_OUTPUT"
            echo "color=0xFF0000" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: sarisia/actions-status-discord@v1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status == 'success' && 'success' || 'failure' }}
          title: "${{ steps.status.outputs.status == 'success' && 'Deployed' || 'Deployment Issue' }} - ${{ github.event.release.tag_name }}"
          description: |
            **Release:** [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})
            **Status:** ${{ steps.status.outputs.message }}

            **Deployments:**
            - Bot (Raspberry Pi): ${{ needs.deploy-bot.result }}
            - Vercel (Frontend): ${{ needs.deploy-vercel.result }}
            ${{ needs.deploy-vercel.outputs.deployment-url && format('- Vercel URL: {0}', needs.deploy-vercel.outputs.deployment-url) || '' }}

            [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ steps.status.outputs.color }}
          username: GitHub Actions
