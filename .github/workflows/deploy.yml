# Deploy Workflow - Triggered when a GitHub Release is published
#
# FLOW: Release published → Deploy bot to Pi → Trigger Vercel Deploy Hook → Notify Discord
#
# This is the second half of the release gate. After release.yml creates a
# draft release, a human reviews and publishes it. Publishing triggers this
# workflow which deploys everything.

name: Deploy

on:
  release:
    types: [published]

# Only one deployment at a time
concurrency:
  group: deploy-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Deploy Discord bot to Raspberry Pi
  # ---------------------------------------------------------------------------
  deploy-bot:
    name: Deploy Bot to Pi
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Job 2: Trigger Vercel deployment via Deploy Hook
  # ---------------------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret not set. Skipping Vercel deployment."
            echo "To enable: add VERCEL_DEPLOY_HOOK_URL secret in GitHub repo settings."
            exit 0
          fi

          echo "Triggering Vercel deployment for ${{ github.event.release.tag_name }}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Vercel deployment triggered successfully (HTTP $HTTP_CODE)"
          else
            echo "::error::Vercel Deploy Hook failed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Send Discord notification with deployment results
  # ---------------------------------------------------------------------------
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [deploy-bot, deploy-vercel]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          BOT_RESULT="${{ needs.deploy-bot.result }}"
          VERCEL_RESULT="${{ needs.deploy-vercel.result }}"

          if [ "$BOT_RESULT" = "success" ] && [ "$VERCEL_RESULT" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=All deployments successful" >> "$GITHUB_OUTPUT"
            echo "color=0x00FF00" >> "$GITHUB_OUTPUT"
          elif [ "$BOT_RESULT" = "success" ] || [ "$VERCEL_RESULT" = "success" ]; then
            echo "status=partial" >> "$GITHUB_OUTPUT"
            echo "message=Partial deployment (Bot: $BOT_RESULT, Vercel: $VERCEL_RESULT)" >> "$GITHUB_OUTPUT"
            echo "color=0xFFA500" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "message=All deployments failed" >> "$GITHUB_OUTPUT"
            echo "color=0xFF0000" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status == 'success' && 'success' || 'failure' }}
          title: "${{ steps.status.outputs.status == 'success' && 'Deployed' || 'Deployment Issue' }} - ${{ github.event.release.tag_name }}"
          description: |
            **Release:** [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})
            **Status:** ${{ steps.status.outputs.message }}

            **Deployments:**
            - Bot (Raspberry Pi): ${{ needs.deploy-bot.result }}
            - Vercel (Frontend): ${{ needs.deploy-vercel.result }}

            [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ steps.status.outputs.color }}
          username: GitHub Actions
