# Gitleaks Configuration File
# Version 8.x compatible

title = "Gitleaks configuration for Sunny Stack"

[extend]
# useDefault will extend the base configuration with the default gitleaks config
useDefault = true

# Global allowlist
[allowlist]
description = "Global allow list"
paths = [
    # Test files
    '''.*test.*''',
    '''.*spec.*''',
    '''.*mock.*''',
    '''__tests__''',
    '''__mocks__''',

    # Documentation
    '''\.md$''',
    '''\.txt$''',
    '''docs/''',

    # Lock files
    '''package-lock\.json''',
    '''yarn\.lock''',
    '''pnpm-lock\.yaml''',

    # Environment examples
    '''\.env\.example''',
    '''\.env\.template''',
    '''\.env\.sample''',

    # Build outputs
    '''dist/''',
    '''build/''',
    '''\.next/''',
    '''out/''',

    # Node modules
    '''node_modules/''',

    # IDE files
    '''\.vscode/''',
    '''\.idea/''',

    # Trinity files
    '''trinity/''',
]

# Specific patterns to ignore
[[rules]]
description = "Allow mock/test API keys"
id = "mock-api-keys"
regex = '''(test_api_key|mock_api_key|example_key|sample_key)'''
tags = ["key", "API", "test"]
allowlist.regexes = [
    '''(test|mock|example|sample)_api_key''',
    '''test_api_key_for_jest_testing''',
    '''mock_api_key_for_build''',
]

[[rules]]
description = "Allow GitHub Actions placeholder values"
id = "github-actions-placeholders"
regex = '''RESEND_API_KEY.*=.*["']mock_api_key_for_build["']'''
tags = ["github", "actions"]
allowlist.paths = [
    '''.github/workflows/.*\.yml''',
    '''.github/workflows/.*\.yaml''',
]

[[rules]]
description = "Allow environment variable declarations in workflows"
id = "workflow-env-vars"
regex = '''\$\{\{.*secrets\..*\}\}'''
tags = ["github", "secrets"]
allowlist.paths = [
    '''.github/workflows/.*\.yml''',
    '''.github/workflows/.*\.yaml''',
]
