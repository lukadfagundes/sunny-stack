# =============================================================================
# Sunny Stack - Development Docker Compose
# =============================================================================
# For Windows local development with PostgreSQL database
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database - Development
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sunny-stack-db-dev
    restart: unless-stopped

    # Load environment variables from .env.local
    env_file:
      - .env.local

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunnystack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sunnystack}
      # Performance tuning for development
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_MAX_CONNECTIONS: 100

    volumes:
      # Persistent data storage
      - postgres-dev-data:/var/lib/postgresql/data
      # Optional: Initialize with Prisma schema
      - ./prisma:/docker-entrypoint-initdb.d/prisma:ro

    ports:
      # Expose to host for direct database access (debugging, GUI tools)
      - "5432:5432"

    networks:
      - sunny-stack-dev-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sunnystack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Resource limits for development (less restrictive than production)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    labels:
      com.sunny-stack.service: "postgres"
      com.sunny-stack.environment: "development"

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-dev-data:
    driver: local
    labels:
      com.sunny-stack.description: "PostgreSQL development database storage"

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  sunny-stack-dev-network:
    driver: bridge
    labels:
      com.sunny-stack.description: "Development network for local services"
# =============================================================================
# Usage Instructions
# =============================================================================
#
# Start PostgreSQL:
#   docker compose -f docker-compose.dev.yml up -d postgres
#
# Stop PostgreSQL:
#   docker compose -f docker-compose.dev.yml down
#
# View Logs:
#   docker compose -f docker-compose.dev.yml logs -f postgres
#
# Check Health:
#   docker compose -f docker-compose.dev.yml ps postgres
#
# Database Connection:
#   Host: localhost
#   Port: 5432
#   Database: sunnystack
#   User: sunnystack
#   Password: (from .env.local)
#
# Run Prisma Migrations:
#   npx prisma migrate dev
#   (Requires DATABASE_URL in .env.local pointing to localhost:5432)
#
# Access PostgreSQL CLI:
#   docker exec -it sunny-stack-db-dev psql -U sunnystack -d sunnystack
#
# Reset Database (WARNING: Deletes all data):
#   docker compose -f docker-compose.dev.yml down -v
#   docker compose -f docker-compose.dev.yml up -d postgres
#
# =============================================================================
