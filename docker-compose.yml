# =============================================================================
# Sunny Stack - Docker Compose Configuration
# =============================================================================
# For local development testing of the Discord bot
# Production deployment uses GitHub Actions + Raspberry Pi
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Discord Bot Service
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: sunny-stack-bot
    restart: unless-stopped

    # Environment variables (loaded from .env.local)
    env_file:
      - .env.local

    # Additional environment overrides
    environment:
      - NODE_ENV=development
      - BOT_API_URL=http://host.docker.internal:3000/api # Access Next.js dev server

    # Volumes for development (hot reload)
    volumes:
      - ./bot:/app/bot:ro # Bot source code (read-only)
      - ./lib:/app/lib:ro # Shared libraries (read-only)
      - /app/node_modules # Prevent overwriting node_modules

    # Network configuration
    networks:
      - sunny-stack-network

    # Extra hosts for accessing host machine (Next.js dev server)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Resource limits (adjust based on Pi resources)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL (Optional - for local development without Vercel)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sunny-stack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sunnystack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./lib/db/migrations:/docker-entrypoint-initdb.d:ro

    networks:
      - sunny-stack-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Only start if explicitly requested
    profiles:
      - with-db

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  sunny-stack-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
# =============================================================================
# Usage Examples
# =============================================================================
#
# Start bot only (uses Vercel Postgres):
#   docker-compose up bot
#
# Start bot + local PostgreSQL:
#   docker-compose --profile with-db up
#
# Build and start in detached mode:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f bot
#
# Stop services:
#   docker-compose down
#
# Stop and remove volumes:
#   docker-compose down -v
#
# =============================================================================
